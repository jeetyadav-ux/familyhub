name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FAMILYHUB_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (shared, API, mobile)
        run: npm test
      - name: Database tests (RLS, RPCs, invariants)
        run: npm run test:db
      - name: Mobile bundle builds
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-secret-0000
        run: npx expo export --platform web --output-dir /tmp/web-build
